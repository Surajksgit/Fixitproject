{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXIT | User Login</title>

  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- GSAP & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-top: 100px;
      overflow: hidden;
    }

    .auth-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 70% 30%, rgba(59, 130, 246, 0.1), transparent 50%),
        radial-gradient(circle at 20% 70%, rgba(249, 115, 22, 0.05), transparent 50%);
      z-index: -1;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 50px;
      border-radius: 30px;
      width: 100%;
      max-width: 450px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(30px);
    }

    .auth-header h2 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
      box-shadow: none;
      color: white;
    }

    .form-label {
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .auth-footer {
      margin-top: 30px;
      text-align: center;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .alert {
      border-radius: 12px;
      border: none;
      margin-bottom: 25px;
    }
  </style>
</head>

<body>

  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand brand-title mx-auto" href="{% url 'home' %}">FIXIT</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="auth-header text-center mb-5">
        <h2 class="hero-title" style="font-size: 2.2rem;">Welcome <span>Back</span></h2>
        <p class="text-muted">Enter your credentials to continue</p>
      </div>

      {% if messages %}
      {% for message in messages %}
      <div class="alert alert-{% if message.tags %}{{ message.tags }}{% endif %} alert-dismissible fade show"
        role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
      </div>
      {% endfor %}
      {% endif %}

      <form method="POST">
        {% csrf_token %}
        <div class="mb-4">
          <label class="form-label">Email or Username</label>
          <input type="text" name="email" class="form-control" placeholder="example@mail.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-premium btn-primary-custom w-100 justify-content-center py-3">
          Sign In <i class="bi bi-box-arrow-in-right"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>New here? <a href="{% url 'user_reg' %}">Create Account</a></p>
      </div>

      {% if error %}
      <div class="alert alert-danger mt-4">{{ error }}</div>
      {% endif %}
    </div>
  </div>

  <script>
    // Custom Cursor
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');

    window.addEventListener('mousemove', (e) => {
      gsap.set(cursorDot, { x: e.clientX, y: e.clientY });
      gsap.to(cursorOutline, {
        x: e.clientX - 20,
        y: e.clientY - 20,
        duration: 0.5,
        ease: "power3.out"
      });
    });

    // Entrance Animation
    gsap.to('.auth-card', {
      opacity: 1,
      y: 0,
      duration: 1.2,
      ease: "expo.out",
      delay: 0.2
    });

    // Split text branding animation
    const split = new SplitType('.hero-title', { types: 'chars' });
    gsap.from(split.chars, {
      opacity: 0,
      y: 20,
      stagger: 0.05,
      duration: 0.8,
      ease: "back.out",
      delay: 0.5
    });
  </script>
</body>

</html>
