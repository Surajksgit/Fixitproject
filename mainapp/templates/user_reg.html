{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FIXIT | User Registration</title>

  <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <!-- GSAP & Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/split-type"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 120px 20px 60px;
      overflow: hidden;
    }

    .auth-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.1), transparent 50%),
        radial-gradient(circle at 90% 80%, rgba(249, 115, 22, 0.05), transparent 50%);
      z-index: -1;
    }

    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      padding: 50px;
      border-radius: 40px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(40px);
    }

    .auth-header h2 {
      font-size: 2.8rem;
      margin-bottom: 30px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      color: white;
      padding: 14px 20px;
      border-radius: 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--primary);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.1);
      color: white;
    }

    .form-label {
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
    }

    .auth-footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-muted);
    }

    .auth-footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .form-check-input {
      background-color: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }
  </style>
</head>

<body>

  <div class="cursor-dot"></div>
  <div class="cursor-outline"></div>

  <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand brand-title mx-auto" href="{% url 'home' %}">FIXIT</a>
    </div>
  </nav>

  <div class="auth-page">
    <div class="auth-bg"></div>
    <div class="auth-card">
      <div class="auth-header text-center mb-5">
        <h2 class="hero-title" style="font-size: 2.5rem;">Join <span>FIXIT</span> Today</h2>
        <p class="text-muted">Create your account to start booking premium services</p>
      </div>

      <form method="POST">
        {% csrf_token %}
        <div class="row g-4">
          <div class="col-md-6">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" placeholder="John Doe" required pattern="[A-Z a-z]+">
          </div>
          <div class="col-md-6">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone Number</label>
            <input type="text" name="phone" class="form-control" placeholder="9876543210" required
              pattern="[6789][0-9]{9}">
          </div>
          <div class="col-md-6">
            <label class="form-label">City</label>
            <input type="text" name="city" class="form-control" placeholder="Kochi" required>
          </div>
          <div class="col-12">
            <label class="form-label">Delivery Address</label>
            <textarea name="address" class="form-control" placeholder="House name, Street, Land mark..." required
              rows="2"></textarea>
          </div>
          <div class="col-md-6">
            <label class="form-label">Create Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required
              pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$" title="8+ chars, 1 Upper, 1 Lower, 1 Number">
          </div>
          <div class="col-md-6">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required
              pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$">
          </div>
        </div>

        <div class="form-check mt-5 mb-4 d-flex align-items-center justify-content-center gap-2">
          <input class="form-check-input" type="checkbox" id="terms" required>
          <label class="form-check-label text-muted small" for="terms">
            I agree to the <a href="#" class="text-primary fw-bold text-decoration-none">Terms & Conditions</a>
          </label>
        </div>

        <button type="submit" class="btn-premium btn-primary-custom w-100 justify-content-center py-3">
          Complete Registration <i class="bi bi-person-plus-fill"></i>
        </button>
      </form>

      <div class="auth-footer">
        <p>Already a member? <a href="{% url 'user_login' %}">Sign In</a></p>
      </div>

      {% if error %}
      <div class="alert alert-danger mt-4 rounded-3 border-0">{{ error }}</div>
      {% endif %}
    </div>
  </div>

  <script>
    // Smooth scroll
    const lenis = new Lenis();
    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Custom Cursor
    const cursorDot = document.querySelector('.cursor-dot');
    const cursorOutline = document.querySelector('.cursor-outline');

    window.addEventListener('mousemove', (e) => {
      gsap.set(cursorDot, { x: e.clientX, y: e.clientY });
      gsap.to(cursorOutline, {
        x: e.clientX - 20,
        y: e.clientY - 20,
        duration: 0.5,
        ease: "power3.out"
      });
    });

    // Entrance Animation
    gsap.to('.auth-card', {
      opacity: 1,
      y: 0,
      duration: 1.5,
      ease: "expo.out",
      delay: 0.2
    });

    // Split text branding animation
    const split = new SplitType('.hero-title', { types: 'chars' });
    gsap.from(split.chars, {
      opacity: 0,
      y: 20,
      stagger: 0.04,
      duration: 0.8,
      ease: "back.out",
      delay: 0.4
    });
  </script>
</body>

</html>
