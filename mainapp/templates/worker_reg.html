{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXIT | Partner Registration</title>

    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- GSAP & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 120px 20px 60px;
            overflow: hidden;
        }

        .auth-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 80% 20%, rgba(59, 130, 246, 0.1), transparent 50%),
                radial-gradient(circle at 20% 80%, rgba(16, 185, 129, 0.05), transparent 50%);
            z-index: -1;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 50px;
            border-radius: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(40px);
        }

        .form-control,
        .form-select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 18px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.1);
            color: white;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gender-group {
            display: flex;
            gap: 20px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
        }

        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        .section-divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--glass-border), transparent);
            margin: 30px 0;
        }
    </style>
</head>

<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand brand-title mx-auto" href="{% url 'home' %}">FIXIT</a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-card">
            <div class="auth-header text-center mb-5">
                <span class="category-tag mb-3 d-inline-block">Join our Expert Network</span>
                <h2 class="hero-title" style="font-size: 2.5rem;">Partner <span>Registration</span></h2>
                <p class="text-muted">Start earning by providing premium services in your city</p>
            </div>

            <form method="POST" action="{% url 'workerregister' %}">
                {% csrf_token %}
                <div class="row g-4">
                    <!-- Title & Gender -->
                    <div class="col-md-3">
                        <label class="form-label">Title</label>
                        <select name="title" class="form-select" required>
                            <option value="Mr">Mr.</option>
                            <option value="Ms">Ms.</option>
                        </select>
                    </div>
                    <div class="col-md-9">
                        <label class="form-label">Gender</label>
                        <div class="gender-group">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" value="Male" id="male"
                                    required>
                                <label class="form-check-label text-white" for="male">Male</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="gender" value="Female" id="female"
                                    required>
                                <label class="form-check-label text-white" for="female">Female</label>
                            </div>
                        </div>
                    </div>

                    <!-- Personal Info -->
                    <div class="col-md-6">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" placeholder="Aravind" required
                            pattern="[A-Za-z]+">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" placeholder="Kumar" required>
                    </div>

                    <!-- Contact -->
                    <div class="col-md-6">
                        <label class="form-label">Work Email</label>
                        <input type="email" name="email" class="form-control" placeholder="p.kumar@fixit.com" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Phone Number</label>
                        <input type="text" name="phone" class="form-control" placeholder="9876543210" required
                            pattern="[6789][0-9]{9}">
                    </div>

                    <div class="col-12 section-divider"></div>

                    <!-- Professional Info -->
                    <div class="col-md-4">
                        <label class="form-label">Profession</label>
                        <select name="profession" class="form-select" required>
                            <option value="Plumbing">Plumber</option>
                            <option value="Electrician">Electrician</option>
                            <option value="Gardening">Gardener</option>
                            <option value="Cleaning">Cleaner</option>
                            <option value="Painting">Painter</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Experience</label>
                        <select name="experience" class="form-select" required>
                            <option value="1yr">1 Year</option>
                            <option value="1-3yr">1-3 Years</option>
                            <option value="3-5yr">3-5 Years</option>
                            <option value="5+yr">5+ Years</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Min Charge</label>
                        <select name="amount" class="form-select" required>
                            <option value="500Rs">₹500 </option>
                            <option value="1000Rs">₹1000</option>
                            <option value="1500Rs">₹1500</option>
                            <option value="2000Rs">₹2000</option>
                        </select>
                    </div>

                    <!-- Password -->
                    <div class="col-md-6">
                        <label class="form-label">Security Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required
                            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$"
                            title="8+ chars, 1 Upper, 1 Lower, 1 Number">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••"
                            required>
                    </div>
                </div>

                <div class="form-check mt-5 mb-4 d-flex align-items-center justify-content-center gap-2">
                    <input class="form-check-input" type="checkbox" id="terms" required>
                    <label class="form-check-label text-muted small" for="terms">
                        I agree to the <a href="#" class="text-primary fw-bold text-decoration-none">Partner
                            Agreement</a>
                    </label>
                </div>

                <button type="submit" class="btn-premium btn-primary-custom w-100 justify-content-center py-3">
                    Submit Application <i class="bi bi-send-fill ms-2"></i>
                </button>
            </form>

            <div class="auth-footer text-center mt-4">
                <p class="text-muted small">Already a partner? <a href="{% url 'worker_login' %}"
                        class="text-primary fw-bold text-decoration-none">Sign In</a></p>
            </div>
        </div>
    </div>

    <script>
        const lenis = new Lenis();
        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        // Custom Cursor
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            gsap.set(cursorDot, { x: e.clientX, y: e.clientY });
            gsap.to(cursorOutline, {
                x: e.clientX - 20,
                y: e.clientY - 20,
                duration: 0.5,
                ease: "power3.out"
            });
        });

        // Entrance Animation
        gsap.to('.auth-card', {
            opacity: 1,
            y: 0,
            duration: 1.5,
            ease: "expo.out",
            delay: 0.2
        });

        // Split text branding animation
        const split = new SplitType('.hero-title', { types: 'chars' });
        gsap.from(split.chars, {
            opacity: 0,
            y: 20,
            stagger: 0.04,
            duration: 0.8,
            ease: "back.out",
            delay: 0.4
        });
    </script>
</body>

</html>
