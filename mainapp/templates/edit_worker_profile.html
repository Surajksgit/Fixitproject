{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXIT | Edit Professional Profile</title>
    <meta name="description" content="Update your personal and contact details on your FIXIT partner profile.">

    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Lenis Smooth Scroll -->
    <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>

    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-card: #ffffff;
            --text-heading: #0f172a;
            --text-body: #334155;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-soft: #eff6ff;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04), 0 1px 2px rgba(15, 23, 42, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -2px rgba(15, 23, 42, 0.03);
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.03);
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth Scrolling Configuration */
        html {
            scroll-behavior: smooth;
        }
        html.lenis, html.lenis body {
            height: auto;
        }
        .lenis.lenis-smooth {
            scroll-behavior: auto !important;
        }
        .lenis.lenis-smooth [data-lenis-prevent] {
            overscroll-behavior: contain;
        }
        .lenis.lenis-stopped {
            overflow: hidden;
        }
        .lenis.lenis-scrolling iframe {
            pointer-events: none;
        }

        body {
            background-color: var(--bg-page);
            color: var(--text-body);
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .dash-navbar {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 0;
            position: sticky;
            top: 0;
            z-index: 1030;
        }

        .brand-logo-wrap {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon-box {
            width: 38px;
            height: 38px;
            background: var(--primary);
            color: #ffffff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
        }

        .brand-name {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-heading);
            margin: 0;
        }

        .brand-name span {
            color: var(--primary);
        }

        .edit-page-content {
            padding: 40px 20px 80px;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .edit-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 580px;
            box-shadow: var(--shadow-lg);
        }

        .form-label-clean {
            font-weight: 600;
            color: var(--text-heading);
            font-size: 0.88rem;
            margin-bottom: 6px;
        }

        .form-control-clean {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            font-size: 0.92rem;
            color: var(--text-heading);
            transition: var(--transition);
            width: 100%;
        }

        .form-control-clean:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        .btn-save {
            background: var(--primary);
            color: #ffffff;
            font-weight: 600;
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            transition: var(--transition);
        }

        .btn-save:hover {
            background: var(--primary-hover);
            color: #ffffff;
        }
    </style>
</head>

<body>

    <nav class="dash-navbar">
        <div class="container">
            <div class="d-flex align-items-center justify-content-between">
                <a class="brand-logo-wrap" href="{% url 'worker_dashboard' %}">
                    <div class="brand-icon-box"><i class="bi bi-tools"></i></div>
                    <h1 class="brand-name">FIX<span>IT</span></h1>
                </a>

                <a href="{% url 'worker_dashboard' %}" class="btn btn-outline-secondary btn-sm rounded-pill px-3 fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </nav>

    <main class="edit-page-content">
        <div class="edit-card">
            <div class="text-center mb-4">
                <div class="d-inline-flex p-3 rounded-circle bg-primary-subtle text-primary mb-2">
                    <i class="bi bi-person-gear fs-3"></i>
                </div>
                <h2 class="fw-bold fs-3 mb-1 text-dark">Edit Partner Profile</h2>
                <p class="text-muted small">Update your name, contact email, and phone number</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="first_name" class="form-label-clean">First Name</label>
                        <input type="text" class="form-control-clean" id="first_name" name="first_name" value="{{ worker.first_name }}" required>
                    </div>

                    <div class="col-md-6">
                        <label for="last_name" class="form-label-clean">Last Name</label>
                        <input type="text" class="form-control-clean" id="last_name" name="last_name" value="{{ worker.last_name }}" required>
                    </div>

                    <div class="col-12">
                        <label for="email" class="form-label-clean">Work Email Address</label>
                        <input type="email" class="form-control-clean" id="email" name="email" value="{{ worker.email }}" required>
                    </div>

                    <div class="col-12">
                        <label for="phone" class="form-label-clean">Contact Phone Number</label>
                        <input type="text" class="form-control-clean" id="phone" name="phone" value="{{ worker.phone }}" required>
                    </div>
                </div>

                <div class="d-flex gap-3 mt-4 pt-2">
                    <a href="{% url 'worker_dashboard' %}" class="btn btn-light flex-grow-1 rounded-pill fw-semibold py-2">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-save flex-grow-1 py-2">
                        Save Changes <i class="bi bi-check2 ms-1"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="border-top py-3 text-center text-muted small bg-white mt-auto">
        © 2026 FIXIT Technologies Inc. All rights reserved.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            orientation: 'vertical',
            gestureOrientation: 'vertical',
            smoothWheel: true,
            wheelMultiplier: 1.0,
            touchMultiplier: 1.5,
            infinite: false
        });

        function raf(time) {
            lenis.raf(time);
            requestAnimationFrame(raf);
        }
        requestAnimationFrame(raf);

        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const targetId = this.getAttribute('href');
                if (targetId && targetId.length > 1 && targetId.startsWith('#')) {
                    const targetEl = document.querySelector(targetId);
                    if (targetEl) {
                        e.preventDefault();
                        lenis.scrollTo(targetEl, { offset: -20, duration: 1.2 });
                    }
                }
            });
        });
    </script>
</body>

</html>
