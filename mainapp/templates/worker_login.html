{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIXIT | Worker Login</title>

    <link rel="icon" href="{% static 'images/favicon.ico' %}" type="image/x-icon">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- GSAP & Plugins -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding-top: 100px;
            overflow: hidden;
        }

        .auth-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.1), transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(16, 185, 129, 0.05), transparent 50%);
            z-index: -1;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            padding: 50px;
            border-radius: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
        }

        .auth-header h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            box-shadow: none;
            color: white;
        }

        .form-label {
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>

    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand brand-title mx-auto" href="{% url 'home' %}">FIXIT</a>
        </div>
    </nav>

    <div class="auth-page">
        <div class="auth-bg"></div>
        <div class="auth-card">
            <div class="auth-header text-center mb-5">
                <span class="category-tag mb-3 d-inline-block">Expert Portal</span>
                <h2 class="hero-title" style="font-size: 2.2rem;">Worker <span>Login</span></h2>
                <p class="text-muted">Manage your tasks and requests</p>
            </div>

            {% if messages %}
            {% for message in messages %}
            <div class="alert alert-{% if message.tags %}{{ message.tags }}{% endif %} alert-dismissible fade show"
                role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form method="POST" action="{% url 'worker_login' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="expert@fixit.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-premium btn-primary-custom w-100 justify-content-center py-3">
                    Partner Sign In <i class="bi bi-briefcase-fill"></i>
                </button>
            </form>

            <div class="auth-footer mt-4 text-center">
                <p class="text-muted small">Not a partner? <a href="{% url 'workerregister' %}"
                        class="text-primary fw-bold text-decoration-none">Apply Now</a></p>
            </div>

            {% if error %}
            <div class="alert alert-danger mt-4 rounded-3 border-0">{{ error }}</div>
            {% endif %}
        </div>
    </div>

    <script>
        // Custom Cursor
        const cursorDot = document.querySelector('.cursor-dot');
        const cursorOutline = document.querySelector('.cursor-outline');

        window.addEventListener('mousemove', (e) => {
            gsap.set(cursorDot, { x: e.clientX, y: e.clientY });
            gsap.to(cursorOutline, {
                x: e.clientX - 20,
                y: e.clientY - 20,
                duration: 0.5,
                ease: "power3.out"
            });
        });

        // Entrance Animation
        gsap.to('.auth-card', {
            opacity: 1,
            y: 0,
            duration: 1.2,
            ease: "expo.out",
            delay: 0.2
        });

        // Split text branding animation
        const split = new SplitType('.hero-title', { types: 'chars' });
        gsap.from(split.chars, {
            opacity: 0,
            y: 20,
            stagger: 0.05,
            duration: 0.8,
            ease: "back.out",
            delay: 0.5
        });
    </script>
</body>

</html>
